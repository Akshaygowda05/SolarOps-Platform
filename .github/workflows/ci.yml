name: Learn GitHub Actions

on:
  push:

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: check the folder name
        run: ls -la

      - name: Check Node and Npm version
        run: |
          node -v
          npm -v

      - name : Install dependencies
        working-directory: ./userManagmentBackend
        run: npm ci

      - name : Generate Prisma Client
        working-directory: ./userManagmentBackend
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/dummy
        run: npx prisma generate

      - name: build the backend
        working-directory: ./userManagmentBackend
        run: npm run build
      
      - name: Install dependencies for frontend
        working-directory: ./userManagementFrontend
        run: npm ci

      - name : build the frontend
        working-directory: ./userManagementFrontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t user-management-backend:1.0 ./userManagmentBackend

      - name: Build frontend Docker image
        run: docker build -t user-management-frontend:1.0 ./userManagementFrontend
        
     
