name: Learn GitHub Actions

on:
  push:

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: check the folder name
        run: ls -la

      - name: Check Node and Npm version
        run: |
          node -v
          npm -v

      - name : Install dependencies
        working-directory: ./userManagmentBackend
        run: npm ci
      
      - name: Run tests
        working-directory: ./userManagementFrontend
        run: npm ci
        
      - name: Run tests
        working-directory: ./userManagementFrontend
        run: npm run build
