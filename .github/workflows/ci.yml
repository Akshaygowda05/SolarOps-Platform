name: Learn GitHub Actions

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: check the folder name
        run: ls -la

      - name: Check Node and Npm version
        run: |
          node -v
          npm -v

      - name : Install dependencies
        working-directory: ./userManagmentBackend
        run: npm ci

      - name : Generate Prisma Client
        working-directory: ./userManagmentBackend
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/dummy
        run: npx prisma generate

      - name: build the backend
        working-directory: ./userManagmentBackend
        run: npm run build
      
      - name: Install dependencies for frontend
        working-directory: ./userManagementFrontend
        run: npm ci

      - name : build the frontend
        working-directory: ./userManagementFrontend
        run: npm run build


      - name: login to github container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase GitHub username
        run: echo "IMAGE_OWNER=${GITHUB_ACTOR,,}" >> $GITHUB_ENV

      - name: Build backend Docker image
        run: docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/user-management-backend:1.0 ./userManagmentBackend

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/user-management-frontend:1.0 ./userManagementFrontend

      - name: Push backend Docker image to GitHub Container Registry
        run: docker push ghcr.io/${{ env.IMAGE_OWNER }}/user-management-backend:1.0

      - name: Push frontend Docker image to GitHub Container Registry
        run: docker push ghcr.io/${{ env.IMAGE_OWNER }}/user-management-frontend:1.0
      
        
     
