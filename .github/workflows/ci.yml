name: Learn GitHub Actions

on:
  push:

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node version
        run: node -v

      - name: Check npm version
        run: npm -v